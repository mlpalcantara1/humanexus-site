name: Portal — validação

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portal:
    runs-on: ubuntu-latest
    env:
      HUMANEXUS_ENVIRONMENT: homologacao
      HUMANEXUS_CORE_API_URL: https://api-homologacao.invalid
      NEXT_PUBLIC_HUMANEXUS_APP_URL: https://homologacao.invalid
      HUMANEXUS_INVITE_SECRET: segredo-ficticio-de-ci-com-mais-de-32-caracteres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:vercel
